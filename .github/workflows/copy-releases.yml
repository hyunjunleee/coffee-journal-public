# One-off: makes the copied release notes byte-identical to hyunjunleee/coffee-journal's.
name: Copy releases
on:
  push:
    branches: [migrate-releases]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: hyunjunleee/coffee-journal
    steps:
      - name: Release notes exactly as the source
        run: |
          set -euo pipefail
          gh api "repos/$SRC/releases?per_page=100" > releases.json
          jq -c '.[]' releases.json | while read -r rel; do
            tag=$(jq -r .tag_name <<<"$rel")
            jq -j '.body // ""' <<<"$rel" > notes.md
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md > /dev/null
            a=$(jq -r '.body // ""' <<<"$rel" | sha1sum)
            b=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.body // ""' | sha1sum)
            [ "$a" = "$b" ] && echo "notes OK $tag" || { echo "::error::notes differ for $tag"; exit 1; }
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '"Latest: " + .tag_name'
